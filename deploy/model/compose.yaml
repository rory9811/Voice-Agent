# GPU server: cp .env.example .env, edit it, then: docker compose up -d
name: realtime-venus-model

services:
  model:
    build:
      context: ../..
      dockerfile: deploy/model/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: realtime-venus-model
    restart: unless-stopped
    init: true
    command:
      - --model-type=${MODEL_TYPE:-omni}
      - --model-path=/weights
      - --ref-audio=${REFERENCE_AUDIO:-assets/HT_ref_audio.wav}
      - --memory-minutes=${MEMORY_MINUTES:-40}
      - --host=0.0.0.0
      - --port=8031
    environment:
      VENUS_MODEL_TOKEN: ${VENUS_MODEL_TOKEN:?Set VENUS_MODEL_TOKEN in .env}
    ports:
      - "${MODEL_PORT:-8031}:8031"
    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR in .env}:/weights:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
    healthcheck:
      # Direct, never through a proxy configured for Docker.
      test: ["CMD", "python", "-c", "import json, urllib.request as u; assert json.load(u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8031/healthz', timeout=2))['ready']"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m
