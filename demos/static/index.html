<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="视频全双工和音频双工的实时语音对话。" />
    <title>Realtime Venus</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232d2d2d' stroke-width='2.8' stroke-linecap='round'%3E%3Cpath d='M5 10v4M12 5v14M19 8v8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body data-mode="camera" data-phase="idle">
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z" /><rect x="2" y="6" width="14" height="12" rx="2" /></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" /></symbol>
      <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="m3 3 18 18M9 9v3a3 3 0 0 0 5 2.6M15 11V5a3 3 0 0 0-5.7-1.3M19 10v2a7 7 0 0 1-.9 3.4M5 10v2a7 7 0 0 0 11 5.7M12 19v3" /></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" /></symbol>
      <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5ZM16 9l6 6M22 9l-6 6" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8V4Z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" /></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2-3.5A8 8 0 1 1 21 12Z" /></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M5 10v4M12 5v14M19 8v8" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
    </svg>

    <header class="topbar">
      <div class="topbar-side">
        <h1>Realtime Venus</h1>
        <nav class="modes" aria-label="模式">
          <button class="mode" data-mode="camera" aria-pressed="true">视频全双工</button>
          <button class="mode" data-mode="audio" aria-pressed="false">音频双工</button>
        </nav>
      </div>
      <div class="topbar-side">
        <button id="settings-button" class="plain-button">设置</button>
        <span id="service-state" class="badge" role="status">连接中…</span>
      </div>
    </header>

    <aside id="notice" class="notice" hidden>
      <span id="notice-text"></span>
      <button id="notice-action" class="plain-button" hidden>去设置</button>
      <button id="notice-close" class="notice-close" aria-label="关闭提示" hidden><svg class="icon"><use href="#i-close" /></svg></button>
    </aside>

    <main class="layout">
      <div class="column">
        <section class="media-card" aria-label="画面和麦克风">
          <div id="lamp" class="lamp" hidden><i></i>LIVE <time id="lamp-time">00:00</time></div>
          <div class="screen">
            <video id="preview" muted playsinline hidden></video>
            <div id="screen-empty" class="screen-empty"><svg class="icon"><use href="#i-camera" /></svg><span>开始对话后打开摄像头</span></div>
          </div>
          <div class="wave">
            <canvas id="wave-canvas" aria-hidden="true" hidden></canvas>
            <div id="wave-empty" class="wave-empty"><svg class="icon"><use href="#i-mic" /></svg><span id="wave-empty-text">麦克风波形</span></div>
          </div>
        </section>

        <div class="column-row">
          <section class="card">
            <h2>设备</h2>
            <label class="field"><span>麦克风</span><select id="microphone-device"><option value="">系统默认</option></select></label>
            <label class="field" id="camera-field"><span>摄像头</span><select id="camera-device"><option value="">系统默认</option></select></label>
          </section>
          <section class="card">
            <h2>状态</h2>
            <dl class="stats">
              <div><dt>状态</dt><dd id="stat-phase" aria-live="polite">空闲</dd></div>
              <div><dt>模型</dt><dd id="stat-model" title="">—</dd></div>
              <div><dt>时长</dt><dd id="stat-time">—</dd></div>
              <div><dt>麦克风</dt><dd id="stat-mic">—</dd></div>
              <div><dt>扬声器</dt><dd id="stat-speaker">—</dd></div>
              <div><dt>后台任务</dt><dd id="stat-tasks">0</dd></div>
            </dl>
          </section>
        </div>
      </div>

      <div class="column">
        <details id="tasks" class="card tasks">
          <summary><h2>后台任务</h2><span id="tasks-count" class="tasks-count"></span><svg class="icon"><use href="#i-chevron-down" /></svg></summary>
          <p id="tasks-empty" class="muted">模型把任务交给后台后，会显示在这里。</p>
          <div id="tasks-list" class="tasks-list" aria-live="polite"></div>
        </details>

        <section class="card conversation">
          <div class="conversation-head">
            <h2>对话</h2>
            <div>
              <button id="save-transcript" class="link-button" disabled><svg class="icon"><use href="#i-download" /></svg>保存</button>
              <button id="clear-transcript" class="link-button" disabled><svg class="icon"><use href="#i-trash" /></svg>清空</button>
            </div>
          </div>
          <div id="transcript" class="transcript" aria-live="polite">
            <div id="transcript-empty" class="transcript-empty"><svg class="icon"><use href="#i-chat" /></svg><span>开始对话后，这里显示模型说的话</span></div>
          </div>
        </section>
      </div>

      <section class="controls" aria-label="对话控制">
        <button id="mute-mic" class="control" aria-pressed="false" disabled><svg class="icon"><use href="#i-mic" /></svg><span>麦克风静音</span></button>
        <button id="mute-speaker" class="control" aria-pressed="false" disabled><svg class="icon"><use href="#i-sound" /></svg><span>扬声器静音</span></button>
        <span class="controls-divider"></span>
        <button id="stop" class="control danger" disabled><svg class="icon"><use href="#i-stop" /></svg><span>结束</span></button>
        <button id="start" class="control primary"><svg class="icon"><use href="#i-play" /></svg><span>开始</span></button>
      </section>
    </main>

    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <header class="settings-head">
        <h2 id="settings-title">设置</h2>
        <button class="icon-button" id="settings-close" aria-label="关闭设置"><svg class="icon"><use href="#i-close" /></svg></button>
      </header>
      <form id="settings-form" class="settings-body" novalidate>
        <section id="settings-issues-box" class="issues" role="status" hidden>
          <strong>保存前请先处理：</strong>
          <ul id="settings-issues"></ul>
        </section>

        <section class="settings-section">
          <label class="field"><span>任务执行器</span>
            <select id="task-agent"><option value="codex">Codex</option><option value="claude">Claude Code</option></select>
          </label>
          <p id="login-state" class="login-state" role="status"></p>
          <div id="login-steps" class="login-steps" hidden>
            <p id="login-help"></p>
            <div class="login-command"><code id="login-command"></code><button id="copy-command" type="button" class="plain-button">复制</button></div>
          </div>
          <button id="recheck-login" type="button" class="plain-button">重新检查登录</button>
        </section>

        <label class="field"><span>任务目录</span>
          <input id="workspace" required autocomplete="off" spellcheck="false" placeholder="例如 workspace" />
          <small>任务文件保存在这里。相对路径位于本机的 deploy/web/data 下。</small>
        </label>

        <label class="check"><input id="proactive-progress" type="checkbox" /><span>自动播报任务进度<small>有新进展时用一句话说出来。结果总会告诉你。</small></span></label>
        <label class="field"><span>发言长度（length_penalty）</span>
          <input id="length-penalty" type="number" min="0.1" max="5" step="any" required />
          <small>默认 0.8。小于 1 更早结束发言，大于 1 说得更长。</small>
        </label>

        <details class="group">
          <summary>任务执行<svg class="icon"><use href="#i-chevron-down" /></svg></summary>
          <label class="field"><span>模型</span><input id="agent-model" autocomplete="off" placeholder="留空使用执行器默认模型" /></label>
          <label class="field"><span>推理强度</span><select id="agent-effort" class="effort"></select></label>
          <label class="field"><span id="agent-binary-label">程序路径</span><input id="agent-binary" required autocomplete="off" spellcheck="false" /></label>
        </details>

        <details class="group">
          <summary>任务模式<svg class="icon"><use href="#i-chevron-down" /></svg></summary>
          <label class="field"><span>模式</span>
            <select id="routing-mode"><option value="general">直接执行（默认）</option><option value="auto">自动路由</option></select>
            <small>直接执行把每个请求交给执行器；自动路由会先判断怎么处理。</small>
          </label>
          <fieldset id="routing-options" hidden>
            <label class="field"><span>提供方</span><select id="routing-provider" class="provider"></select></label>
            <label class="field"><span>模型</span><input id="routing-model" autocomplete="off" placeholder="留空使用任务模型" /></label>
            <label class="field"><span>推理强度</span><select id="routing-effort" class="effort"></select></label>
            <label class="field"><span>时间上限（秒）</span><input id="routing-timeout" type="number" min="1" max="180" step="1" required /></label>
          </fieldset>
        </details>

        <details class="group">
          <summary>进度和结果整理<svg class="icon"><use href="#i-chevron-down" /></svg></summary>
          <label class="field"><span>提供方</span><select id="response-provider" class="provider"></select></label>
          <label class="field"><span>模型</span><input id="response-model" autocomplete="off" placeholder="留空使用任务模型" /></label>
          <label class="field"><span>推理强度</span><select id="response-effort" class="effort"></select></label>
        </details>

        <details class="group">
          <summary>多模态理解<svg class="icon"><use href="#i-chevron-down" /></svg></summary>
          <label class="field"><span>提供方</span><select id="multimodal-provider" class="provider"></select></label>
          <label class="field"><span>模型</span><input id="multimodal-model" autocomplete="off" placeholder="留空使用任务模型" /></label>
          <label class="field"><span>推理强度</span><select id="multimodal-effort" class="effort"></select></label>
          <small id="multimodal-audio-hint" class="muted" hidden>当前执行器能理解文字和图片，不能理解音频。需要理解音频时请选 Gemini。</small>
        </details>

        <details class="group">
          <summary>Gemini 连接<svg class="icon"><use href="#i-chevron-down" /></svg></summary>
          <label class="field"><span>默认模型</span><input id="gemini-model" autocomplete="off" required /></label>
          <label class="field"><span>API Key</span>
            <input id="gemini-key" type="password" autocomplete="new-password" spellcheck="false" />
            <small id="gemini-key-status"></small>
          </label>
        </details>

        <footer class="settings-foot">
          <p id="settings-message" class="muted" role="status"></p>
          <button id="save-settings" type="submit" class="control primary compact">保存设置</button>
        </footer>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
